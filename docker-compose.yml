# On the AP computer: docker compose up -d --build
# Starts with the system (restart), reachable only from this computer.
services:
  ap-gra:
    build:
      context: .
      target: app
    image: ap-gra
    container_name: ap-gra
    restart: unless-stopped
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      # User games, creator conversations and logs (docs/kreator-gier.md) -
      # on the disk next to the repo, kept across rebuilds
      - ./dane:/app/dane

  # The game creator (docs/kreator-gier.md): the only service with the API
  # key (.env next to this file, never in git) and the one that talks to the AI
  ap-gra-kreator:
    image: ap-gra  # the same image, built by the ap-gra service above
    pull_policy: never
    depends_on:
      - ap-gra
    container_name: ap-gra-kreator
    restart: unless-stopped
    command: ["uvicorn", "kreator.app:app", "--host", "0.0.0.0", "--port", "8767"]
    ports:
      - "127.0.0.1:8767:8767"
    env_file:
      - path: .env
        required: false  # without it the creator runs, but "ai": false in /v1/kreator/health
    volumes:
      - ./dane:/app/dane

  # Kompan (docs/kompan.md): its own API key (.env.kompan) and its own data -
  # personal conversations and notes, which no other service sees
  ap-gra-kompan:
    image: ap-gra
    pull_policy: never
    depends_on:
      - ap-gra
    container_name: ap-gra-kompan
    restart: unless-stopped
    command: ["uvicorn", "kompan.app:app", "--host", "0.0.0.0", "--port", "8768"]
    ports:
      - "127.0.0.1:8768:8768"
    env_file:
      - path: .env.kompan
        required: false  # without it Kompan runs, but "ai": false in /v1/kompan/health
    environment:
      AP_KOMPAN_DATA: /app/dane-kompan
    volumes:
      - ./dane-kompan:/app/dane-kompan

  # Runs the animation code written by the AI (docs/kreator-gier.md, stage 5):
  # no network, no key, read-only system, limits; sees only dane/rysownik/
  # (jobs from the creator, as files)
  ap-gra-rysownik:
    image: ap-gra
    pull_policy: never
    depends_on:
      - ap-gra
    container_name: ap-gra-rysownik
    restart: unless-stopped
    command: ["python", "-m", "rysownik.serwis", "/praca"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./dane/rysownik:/praca
